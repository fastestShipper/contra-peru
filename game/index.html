<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contra Perú — Lima 2026</title>
<meta name="theme-color" content="#000">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: #000; color: #f4ede4;
    font-family: 'Courier New', monospace; overflow: hidden;
    image-rendering: pixelated; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #000;
  }
  canvas {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; max-width: 100vw; max-height: 100vh;
    box-shadow: 0 0 0 2px #1a0f08, 0 0 120px rgba(255,60,20,.12);
  }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #000; z-index: 50; transition: opacity .4s;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  .boot-title {
    font-size: 42px; color: #ff3a14; text-align: center;
    letter-spacing: .14em; text-shadow: 3px 3px 0 #7a1800, 6px 6px 0 #000;
    margin-bottom: 16px;
  }
  .boot-sub { color: #ffb347; text-align: center; letter-spacing: .2em; font-size: 12px; }
  .credit { position: fixed; bottom: 6px; right: 10px; font-size: 10px; color: #3a2418; letter-spacing: .15em; z-index: 60; }
</style>
</head>
<body>
<div id="stage"><canvas id="view" width="384" height="224"></canvas></div>
<div id="boot">
  <div style="text-align:center">
    <div class="boot-title">CONTRA PERÚ</div>
    <div class="boot-sub">LIMA 2026 · CARGANDO</div>
  </div>
</div>
<div class="credit">v0.1 · zpw</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
